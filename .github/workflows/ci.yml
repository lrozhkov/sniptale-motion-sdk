name: Checks
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    name: Full repository proof and local release candidate
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci-local-proof-bypass')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # Upload the CodeQL SARIF produced by the full local proof.
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright
      MOTION_NPM_BROWSER_ACCEPT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: node tooling/ci/npm.cjs ci --ignore-scripts
      - name: Install controlled Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node tooling/ci/npm.cjs run ci:release
      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: .tmp/codeql/results.sarif
          category: sdk-security-and-quality
      - name: Keep verified local candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-candidate-linux
          path: |
            .tmp/npm-package/*.tgz
            .tmp/npm-package/inventory.json
            .tmp/npm-package/acceptance/summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  windows:
    name: Native Windows QA
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci-local-proof-bypass')
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright
      MOTION_NPM_BROWSER_ACCEPT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: node tooling/ci/npm.cjs ci --ignore-scripts
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node tooling/ci/npm.cjs run qa
      - run: node tooling/ci/npm.cjs run build:npm
      - run: node tooling/ci/npm.cjs run test:npm
  bypass:
    name: Local proof bypass (checks not run)
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-local-proof-bypass')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: echo 'CI checks were bypassed by ci-local-proof-bypass. This run does not prove the candidate.'
