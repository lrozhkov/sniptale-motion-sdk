name: Checks
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: Workflow and supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: node tooling/ci/npm.cjs ci --ignore-scripts
      - run: node tooling/ci/npm.cjs run ci:tools
      - run: node tooling/ci/npm.cjs run lint:ci
      - run: node tooling/ci/npm.cjs run qa:security
  quality:
    name: QA (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright
      MOTION_NPM_BROWSER_ACCEPT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: node tooling/ci/npm.cjs ci --ignore-scripts
      - name: Install controlled Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node tooling/ci/npm.cjs run qa
      - run: node tooling/ci/npm.cjs run build:npm
      - run: node tooling/ci/npm.cjs run test:npm
      - name: Keep verified local candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-candidate-${{ matrix.os }}
          path: |
            .tmp/npm-package/*.tgz
            .tmp/npm-package/inventory.json
            .tmp/npm-package/acceptance/summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
